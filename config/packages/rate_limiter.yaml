framework:
    rate_limiter:
        # Beispiel 1: Für API-Endpunkte (100 Anfragen pro Minute)
        api_limiter:
            policy: 'sliding_window'
            limit: 100
            interval: '1 minute'
            cache_pool: 'cache.rate_limiter'

        # Beispiel 2: Für Login-Formulare (5 Versuche pro 15 Minuten)
        login_limiter:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: 'cache.rate_limiter'
