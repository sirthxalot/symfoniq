framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(REDIS_URL)%/3'
                options:
                    stream: messages
                    group: symfony_workers
                    consumer: '%env(default:default_consumer:MESSENGER_CONSUMER_NAME)%'
                    auto_setup: true
                retry_strategy:
                    max_retries: 3
                    multiplier: 2

            async_high:
                dsn: '%env(REDIS_URL)%/3'
                options:
                    stream: messages_high
                    group: symfony_workers
                    consumer: '%env(default:default_consumer:MESSENGER_CONSUMER_NAME)%'
                    auto_setup: true
                retry_strategy:
                    max_retries: 3
                    multiplier: 2

            failed:
                dsn: '%env(REDIS_URL)%/4'
                options:
                    stream: messages_failed

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async_high
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

parameters:
    default_consumer: 'local_worker_1'
