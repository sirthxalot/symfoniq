name: "Run Unit and Integration Tests on Symfony 8.1"

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main", "release" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Globale Umgebungsvariablen
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://symfony_user:${{ secrets.TEST_DB_PASSWORD }}@127.0.0.1:5432/symfony_test?serverVersion=16&charset=utf8
      # MEILISEARCH_URL: http://127.0.0.1:7700
      # MEILISEARCH_API_KEY: ${{ secrets.TEST_MEILI_KEY }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: symfony_user
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: symfony_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # meilisearch:
      #   image: getmeili/meilisearch:v1.12
      #   env:
      #     MEILI_MASTER_KEY: ${{ secrets.TEST_MEILI_KEY }}
      #     MEILI_ENV: "development"
      #   ports:
      #     - 7700:7700

    strategy:
      fail-fast: false
      matrix:
        php: [8.4]
        symfony: ["8.1.*"]
        dependency-version: [prefer-stable]

    name: P${{ matrix.php }} - S${{ matrix.symfony }} - ${{ matrix.dependency-version }}

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, iconv, intl, mbstring, pcre, pdo, pdo_pgsql, session, simplexml, tokenizer, xml
          coverage: none

      - name: "Configure Symfony Flex"
        run: |
          composer global require "symfony/flex" --no-interaction --no-progress
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: "Install dependencies"
        run: |
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - name: "Warmup Symfony Cache"
        run: php bin/console cache:warmup

      - name: "Prepare Test Database & Search Index"
        run: |
          php bin/console doctrine:schema:create --no-interaction

      - name: "Execute tests"
        run: bin/phpunit
