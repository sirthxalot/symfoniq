name: "Run Unit and Integration Tests on Symfony 8.1"

on:
  push:
    branches: [ "main", "develop", "release/**" ]
  pull_request:
    branches: [ "main", "develop", "release/**" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://symfony_user:symfony_test_pw@127.0.0.1:5432/symfony_test?serverVersion=16&charset=utf8
      # MEILISEARCH_URL: http://127.0.0.1:7700
      # MEILISEARCH_API_KEY: test_meili_key

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: symfony_user
          POSTGRES_PASSWORD: symfony_test_pw
          POSTGRES_DB: symfony_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]

    name: PHP ${{ matrix.php }}

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, iconv, intl, mbstring, pcre, pdo, pdo_pgsql, redis, session, simplexml, tokenizer, xml
          coverage: none

      - name: "Install dependencies"
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: "Warmup Symfony Cache"
        run: php bin/console cache:warmup

      - name: "Prepare Test Database"
        run: php bin/console doctrine:schema:create --no-interaction

      - name: "Execute tests"
        run: php bin/phpunit
